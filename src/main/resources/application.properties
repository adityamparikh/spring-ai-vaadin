vaadin.launch-browser=true
spring.application.name=spring-ai-vaadin

# OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-5.2

# ollama
#spring.ai.openai.api-key=local
#spring.ai.openai.base-url=http://localhost:11434
#spring.ai.openai.chat.options.model=phi4
#spring.ai.openai.embedding.api-key=local
#spring.ai.openai.embedding.base-url=http://localhost:11434
#spring.ai.openai.embedding.options.model=nomic-embed-text

# MCP Client
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=vaadin-mcp-client
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.streamable-http.connections.solr.url=http://localhost:8080
spring.ai.mcp.client.streamable-http.connections.solr.endpoint=/mcp

server.port=8081
# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Keycloak OAuth2 Provider
spring.security.oauth2.client.provider.keycloak.issuer-uri=${OAUTH2_ISSUER_URI}

# Keycloak Client Registration (Authorization Code Flow)
spring.security.oauth2.client.registration.keycloak.client-id=solr-mcp-client
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Debug
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.ai.mcp=DEBUG
logging.level.io.modelcontextprotocol=DEBUG